services:
  - type: web
    name: ip-sakti-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # --- Required secrets (set via Render dashboard, not here) ---
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # HF_TOKEN enables the zero-OOM HF Inference API embedding backend.
      # Get a free token at huggingface.co/settings/tokens (read-only scope).
      # Without this, the app falls back to local fastembed which OOMs on
      # the 512 MB free tier.
      - key: HF_TOKEN
        sync: false
      # --- Tunable defaults (safe to override per-environment) ---
      - key: CONFIDENCE_THRESHOLD
        value: "0.35"
      - key: HYBRID_SEARCH_ENABLED
        value: "true"
      - key: AUTO_BOOTSTRAP_CORPUS
        value: "true"
